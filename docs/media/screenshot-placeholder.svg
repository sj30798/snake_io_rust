<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Snake IO screenshot placeholder">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b2235"/>
      <stop offset="100%" stop-color="#123b2d"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="90" y="80" width="760" height="520" rx="14" fill="#0f1720" stroke="#4ade80" stroke-width="4"/>
  <rect x="900" y="80" width="220" height="520" rx="14" fill="#111827" stroke="#67e8f9" stroke-width="3"/>
  <text x="120" y="145" fill="#d1fae5" font-size="42" font-family="Segoe UI, Arial, sans-serif">Snake IO Rust</text>
  <text x="120" y="195" fill="#a7f3d0" font-size="24" font-family="Segoe UI, Arial, sans-serif">Drop your real screenshot here:</text>
