  <text x="925" y="180" fill="#a5f3fc" font-size="20" font-family="Segoe UI, Arial, sans-serif">Score: 42</text>
  <text x="925" y="215" fill="#a5f3fc" font-size="20" font-family="Segoe UI, Arial, sans-serif">Time: 67s</text>
  <text x="925" y="250" fill="#a5f3fc" font-size="20" font-family="Segoe UI, Arial, sans-serif">Difficulty: Hard</text>
</svg>
